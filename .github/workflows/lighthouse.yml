name: Lighthouse check
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit the live site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://arif3992.github.io/pulsegrid/
          uploadArtifacts: true
